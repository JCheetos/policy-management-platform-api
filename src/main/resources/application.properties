# =====================================================================
# API de Gestión de Pólizas - Módulo 2 (Prueba técnica Davivienda)
# =====================================================================

spring.application.name=api-polizas
server.port=8080

# ---------------------------------------------------------------------
# Base de datos H2 en memoria (suficiente para el alcance de la prueba)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Configuración propia de la aplicación
# ---------------------------------------------------------------------
# Credencial obligatoria en el encabezado x-api-key de todas las peticiones.
# El valor por defecto (123456) es el mínimo exigido por el enunciado de la
# prueba; en un ambiente real se inyecta por variable de entorno o gestor de
# secretos (nunca en el repositorio).
app.api-key=${APP_API_KEY:123456}

# Índice de precios al consumidor (%) aplicado en la renovación
app.ipc-porcentaje=3.5

# CORE transaccional legado (mock). Apunta por defecto a esta misma app.
app.core.url=http://localhost:8080/core-mock/evento
app.core.connect-timeout-segundos=2
app.core.read-timeout-segundos=3

# ---------------------------------------------------------------------
# Observabilidad
# ---------------------------------------------------------------------
logging.level.com.jmendez.polizas=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traza:-sin-traza}] %logger{36} - %msg%n
